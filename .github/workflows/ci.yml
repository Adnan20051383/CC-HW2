name: CI and Release

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint Dockerfile and Python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: part2/Dockerfile

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff

      - name: Ruff
        run: ruff check part2/app

  test:
    name: Run Python Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: part2
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Pytest
        working-directory: part2
        run: python -m pytest -q

  build:
    name: Build Queue Image
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build \
            --tag lab-queue:${{ github.sha }} \
            --file part2/Dockerfile \
            part2

  tag:
    name: Create Annotated Git Tag
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout Full Git History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create or Verify Release Tag
        id: release
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          VERSION="v1.0.0-${SHORT_SHA}"

          if git show-ref --verify --quiet "refs/tags/${VERSION}"; then
            TAG_COMMIT="$(git rev-list -n 1 "${VERSION}")"

            if [[ "${TAG_COMMIT}" != "${GITHUB_SHA}" ]]; then
              echo "::error::Existing tag points to a different commit."
              exit 1
            fi

            echo "Tag already exists on this commit: ${VERSION}"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git tag -a "${VERSION}" -m "Release ${VERSION}"
            git push origin "refs/tags/${VERSION}"
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

  push:
    name: Publish Image to GHCR
    runs-on: ubuntu-latest
    needs: [lint, test, build, tag]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: ./part2
          file: ./part2/Dockerfile
          push: true
          tags: |
            ghcr.io/adnan20051383/lab-queue:latest
            ghcr.io/adnan20051383/lab-queue:${{ needs.tag.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  pages:
    name: Publish GitHub Pages
    runs-on: ubuntu-latest
    needs: [lint, test, build, tag]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare Versioned Website
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          mkdir -p _site
          cp -R part2/site/. _site/

          python - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["VERSION"]
          index = Path("_site/index.html")
          html = index.read_text(encoding="utf-8")

          marker = '<p id="version">__VERSION__</p>'

          if html.count(marker) != 1:
              raise SystemExit(
                  "Expected exactly one version element placeholder."
              )

          html = html.replace(
              marker,
              f'<p id="version">{version}</p>',
              1,
          )

          index.write_text(html, encoding="utf-8")
          print(f"Prepared website version: {version}")
          PY

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4